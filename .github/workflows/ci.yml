name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history, so that gitleaks in make lint scans every commit, not only the last one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./app/go.mod
          cache-dependency-path: ./app/go.sum
      # The same hadolint as on the laptop. The checksum is the release's own (checksums.sha256).
      - name: Install hadolint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  $RUNNER_TEMP/hadolint" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/hadolint" /usr/local/bin/hadolint
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./app/go.mod
          cache-dependency-path: ./app/go.sum
      - run: make test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: make build

  image:
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Actions from other publishers are pinned to a commit SHA: a tag can be moved, a SHA can't.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build api
        run: docker build -t ghcr.io/farisomerbasic/patientping-api:sha-${{ github.sha }} -t ghcr.io/farisomerbasic/patientping-api:latest app
      - name: Build web
        run: docker build -t ghcr.io/farisomerbasic/patientping-web:sha-${{ github.sha }} -t ghcr.io/farisomerbasic/patientping-web:latest web
      - name: Scan the api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/farisomerbasic/patientping-api:sha-${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          version: v0.75.0
      - name: Scan the web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/farisomerbasic/patientping-web:sha-${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          version: v0.75.0
      - name: Push api
        run: docker push --all-tags ghcr.io/farisomerbasic/patientping-api
      - name: Push web
        run: docker push --all-tags ghcr.io/farisomerbasic/patientping-web
