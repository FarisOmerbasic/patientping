name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history, so that gitleaks in make lint scans every commit, not only the last one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./app/go.mod
          cache-dependency-path: ./app/go.sum
      # The same hadolint as on the laptop. The checksum is the release's own (checksums.sha256).
      - name: Install hadolint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  $RUNNER_TEMP/hadolint" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/hadolint" /usr/local/bin/hadolint
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./app/go.mod
          cache-dependency-path: ./app/go.sum
      - run: make test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: make build
      # The same trivy as on the laptop, so a CRITICAL finding stops the PR, not only main's run.
      # Trivy now comes from GitHub's release page with a checksum
      - name: Install trivy
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          sudo install -m 0755 "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
      - run: make scan

  image:
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Lets the job ask GitHub for its OIDC token. It gives no AWS access by itself.
      id-token: write
    outputs:
      server-running: ${{ steps.server.outputs.running }}
    steps:
      - uses: actions/checkout@v7
      # Actions from other publishers are pinned to a commit SHA: a tag can be moved, a SHA can't.
      # No AWS key is stored in GitHub: the job's OIDC token is traded for the role gha-patientping-ci,
      # whose trust policy only accepts a push to main in this repository. The keys last one hour.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Build api
        run: docker build -t ${{ vars.ECR_REGISTRY }}/patientping-api:sha-${{ github.sha }} -t ${{ vars.ECR_REGISTRY }}/patientping-api:latest app
      - name: Build web
        run: docker build -t ${{ vars.ECR_REGISTRY }}/patientping-web:sha-${{ github.sha }} -t ${{ vars.ECR_REGISTRY }}/patientping-web:latest web
      - name: Install trivy
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          sudo install -m 0755 "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
      - name: Scan api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.ECR_REGISTRY }}/patientping-api:sha-${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          version: v0.75.0
          skip-setup-trivy: true
      - name: Scan web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.ECR_REGISTRY }}/patientping-web:sha-${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          version: v0.75.0
          skip-setup-trivy: true
      # A sha- tag is written once. When a re-run finds the commit already published,
      # nothing is pushed, so the tag keeps its image and latest doesn't move back.
      - name: Push api
        env:
          IMAGE: ${{ vars.ECR_REGISTRY }}/patientping-api
        run: |
          if docker manifest inspect "$IMAGE:sha-$GITHUB_SHA" > /dev/null 2>&1; then
            echo "$IMAGE:sha-$GITHUB_SHA is already published, so nothing is pushed"
          else
            docker push --all-tags "$IMAGE"
          fi
      - name: Push web
        env:
          IMAGE: ${{ vars.ECR_REGISTRY }}/patientping-web
        run: |
          if docker manifest inspect "$IMAGE:sha-$GITHUB_SHA" > /dev/null 2>&1; then
            echo "$IMAGE:sha-$GITHUB_SHA is already published, so nothing is pushed"
          else
            docker push --all-tags "$IMAGE"
          fi
      # The dev server only runs while it's being worked on. With no server there's nothing to
      # deploy to, so deploy is skipped instead of waiting for an approval that can only be rejected.
      - name: Find the dev server
        id: server
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=patientping-dev Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [[ "$INSTANCE_ID" == i-* ]]; then
            echo "running=true" >> "$GITHUB_OUTPUT"
            echo "dev server $INSTANCE_ID runs, so deploy waits for an approval"
          else
            echo "running=false" >> "$GITHUB_OUTPUT"
            echo "no dev server runs, so deploy is skipped"
          fi

  deploy:
    needs: [image]
    if: needs.image.outputs.server-running == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      # Lets the job ask GitHub for its OIDC token. It gives no AWS access by itself.
      id-token: write
    steps:
      # Actions from other publishers are pinned to a commit SHA: a tag can be moved, a SHA can't.
      # No AWS key is stored in GitHub: the job's OIDC token is traded for the role gha-patientping-ci,
      # whose trust policy accepts this job only in the environment production, on main. The keys last one hour.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Find the server
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=patientping-dev Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          PUBLIC_IP=$(aws ec2 describe-instances --filters Name=tag:Name,Values=patientping-dev Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"
          echo "server: $INSTANCE_ID at $PUBLIC_IP"
      - name: Deploy
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "deploy sha-$GITHUB_SHA" --parameters "commands=[\"curl -fsSL https://raw.githubusercontent.com/FarisOmerbasic/patientping/$GITHUB_SHA/deploy/deploy.sh -o /tmp/deploy.sh\",\"bash /tmp/deploy.sh sha-$GITHUB_SHA\"]" --query Command.CommandId --output text)
          echo "command: $CMD_ID"
          # One wait gives up after 100 s, and a deploy that rolls back can take longer: up to three waits.
          for _ in 1 2 3; do aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" && break; done || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          if [[ "$STATUS" != "Success" ]]; then
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
              echo "deploy: the command ended with $STATUS" >&2
              exit 1
          fi
      - name: Smoke test from outside
        run: |
          curl -fsS --max-time 10 -o /dev/null -w "%{http_code}\n" "http://$PUBLIC_IP/api/patients"
