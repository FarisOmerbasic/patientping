server {
    listen 80;
    # Answers and error pages say "nginx" without the version.
    server_tokens off;

    # Docker's DNS server. With the address in a variable, nginx asks it again
    # (at most every 10 seconds) instead of keeping the API's address from its
    # start, which is wrong once the API's container is made again.
    resolver 127.0.0.11 valid=10s;

    location / {
        root /usr/share/nginx/html;
    }

    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
    }
}
