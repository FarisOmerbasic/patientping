name: patientping

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    env_file: .env
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - pp-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:?}", "-C", "-b", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    env_file: .env
    volumes:
      - ./migrations:/migrations:ro
    command: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "mssql", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:?}", "-C", "-b", "-i", "/migrations/000_bootstrap.sql"]
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"

  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations:ro
    # The sa password is part of this URL: only letters, digits and - _ . in it.
    command: ["-path", "/migrations", "-database", "sqlserver://sa:${MSSQL_SA_PASSWORD:?}@mssql:1433?database=patientping", "up"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  api:
    build: ./app
    environment:
      STORE: "mssql"
      DB_ADDR: "mssql:1433"
      DB_NAME: "patientping"
      DB_USER: "pp_app"
      DB_PASSWORD: "${PP_DB_PASSWORD:?}"
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./app
    environment:
      DB_ADDR: "mssql:1433"
      DB_NAME: "patientping"
      DB_USER: "pp_app"
      DB_PASSWORD: "${PP_DB_PASSWORD:?}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["/worker"]
    healthcheck:
      test: ["CMD", "/worker", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine-slim
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/public:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1
    # The image's two default flags, plus the address that the links in alert messages use.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=http://localhost:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.34.2
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./observability/discord.url:/etc/alertmanager/discord.url:ro
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:13.2.6
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pp-mssql:
