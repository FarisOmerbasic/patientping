name: patientping

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    env_file: .env
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - pp-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:?}", "-C", "-b", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    env_file: .env
    volumes:
      - ./migrations:/migrations:ro
    command: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "mssql", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:?}", "-C", "-b", "-i", "/migrations/000_bootstrap.sql"]
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"

  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations:ro
    # The sa password is part of this URL: only letters, digits and - _ . in it.
    command: ["-path", "/migrations", "-database", "sqlserver://sa:${MSSQL_SA_PASSWORD:?}@mssql:1433?database=patientping", "up"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  api:
    build: ./app
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      STORE: "mssql"
      DB_ADDR: "mssql:1433"
      DB_NAME: "patientping"
      DB_USER: "pp_app"
      DB_PASSWORD: "${PP_DB_PASSWORD:?}"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pp-mssql:
